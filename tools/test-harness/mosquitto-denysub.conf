# mosquitto-denysub.conf — the A3 "strand bug" fixture (TEST_PLAN §0.3b + §4.1 A3)
#
# WHAT THIS PROVES
#   A3 needs a broker that lets the handheld CONNECT and PUBLISH normally, but REFUSES
#   its subscription to PPNAM/station_2/{deviceId}/res/+. That is the only way to reach the
#   "connected transport, but the response subscription never took" branch. The correct
#   app behaviour is: transport connects, the SUBACK for res/+ comes back as failure
#   (0x80), and the app keeps retrying *the subscribe* on its own timer — it must NOT sit
#   permanently on Offline with a live socket, and must NOT re-issue CONNECT (the old bug,
#   regression R-14).
#
# HOW THE DENY IS EXPRESSED
#   mosquitto has no inline topic-ACL syntax, so the actual allow/deny rules live in the
#   companion file `denysub.acl` (same directory), referenced by `acl_file` below. That
#   ACL grants publish on all of PPNAM/# and read on the station base topic PPNAM/station_2,
#   but grants NO read on any .../res/+ topic — so a subscribe to
#   PPNAM/station_2/{deviceId}/res/+ is denied while publishing (req/# and the retained
#   base-node presence) still works.
#
# ONE-TIME SETUP (run once, from this directory)
#   1. Create a password file containing the SAME username/password the handheld is
#      configured to use for the broker (Settings → broker credentials on the device).
#      Replace <user> below; mosquitto_passwd will prompt for the password:
#
#        mosquitto_passwd -c ./denysub.pwfile <user>
#
#      (mosquitto_passwd ships with mosquitto. The ACL is username-agnostic — it uses
#      `pattern` rules that apply to every authenticated client — so any username works,
#      it just has to authenticate successfully.)
#
#   2. Point the app at this broker: Settings → Host = <this machine's LAN IP>, Port 1883,
#      transport TCP. deviceId stays whatever the device already uses (the contract and
#      TEST_PLAN assume handheld_1); the ACL denies res/+ for every deviceId, so it does
#      not need to be edited per device.
#
#   3. Run the broker in the foreground so you can watch the denied SUBSCRIBE:
#
#        mosquitto -v -c ./mosquitto-denysub.conf
#
#      Expect a log line like:
#        Denied SUBSCRIBE from <client> (topic: PPNAM/station_2/handheld_1/res/+, ...)
#      and the SUBACK carrying failure code 0x80 for that filter.
#
# SAFETY
#   This is a LOCAL test broker only. Do not expose port 1883 beyond the test LAN, and do
#   not point production devices at it — it deliberately breaks response delivery.

# --- listener -----------------------------------------------------------------
listener 1883
# Bind to all interfaces so the C72 on the test LAN can reach it. Narrow to a specific
# address if you prefer: `listener 1883 10.1.50.50`.

# --- authentication -----------------------------------------------------------
# The client must authenticate — anonymous access is off. See ONE-TIME SETUP step 1.
allow_anonymous false
password_file ./denysub.pwfile

# --- access control -----------------------------------------------------------
# The deny lives here. See denysub.acl in this directory.
acl_file ./denysub.acl

# --- misc ---------------------------------------------------------------------
# Presence messages are retained per the contract; keep retained delivery on (default).
# Verbose logging above (-v on the CLI) surfaces the denied SUBSCRIBE for the evidence log.
persistence false
